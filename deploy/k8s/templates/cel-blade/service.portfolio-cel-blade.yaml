# The gateways (behind the ingress), the layers (a headless service: each pod by name, for the
# StatefulSet; gateways find layers through the database, at their pod addresses) and Postgres.
apiVersion: v1
kind: Service
metadata:
  name: portfolio-cel-blade
spec:
  selector:
    app: portfolio-cel-blade-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-cel-blade-realm
spec:
  clusterIP: None
  selector:
    app: portfolio-cel-blade-realm
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-cel-blade-postgres
spec:
  selector:
    app: portfolio-cel-blade-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
