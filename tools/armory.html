<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Armory Viewer</title>
  <style>
    :root { --ink: #14101c; }
    body { margin: 0; padding: 16px; background: #1e1a2a; color: #fff; font-family: "Trebuchet MS", system-ui, sans-serif; }
    h1 { margin: 0 0 4px; }
    p { margin: 0 0 12px; opacity: 0.7; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    select, button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 2px solid var(--ink); background: #3a3350; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .w { background: #2a2438; border: 2px solid var(--ink); border-bottom: 4px solid var(--rc); border-radius: 8px; padding: 6px; font-size: 11px; }
    .w img { width: 100%; aspect-ratio: 1; display: block; }
    .w b { color: var(--rc); font-size: 12px; display: block; }
    .w span { opacity: 0.7; display: block; }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <h1>Armory Viewer</h1>
  <p>Dev tool: renders generated weapons to compare manufacturer component forms.</p>
  <div class="controls">
    <select id="type"><option value="">Any type</option></select>
    <select id="mfr"><option value="">Any manufacturer</option></select>
    <button id="roll">Reroll</button>
  </div>
  <div class="grid" id="grid"></div>
  <script type="module">
    import { generateWeapon } from '../src/items/WeaponGenerator.js';
    import { generateArmor } from '../src/items/ArmorGenerator.js';
    import { itemCardHTML } from '../src/ui/cards.js';
    import { WEAPON_TYPES } from '../src/items/weaponTypes.js';
    import { MANUFACTURERS } from '../src/items/manufacturers.js';
    import { RARITY } from '../src/items/rarity.js';
    import { weaponInfo } from '../src/items/describe.js';
    import { Thumbnails } from '../src/ui/Thumbnails.js';

    const thumbs = new Thumbnails();
    const $ = (id) => document.getElementById(id);
    for (const t of Object.keys(WEAPON_TYPES)) $('type').add(new Option(WEAPON_TYPES[t].label, t));
    for (const sl of ['head', 'chest', 'hands', 'legs']) $('type').add(new Option('Armour: ' + sl, 'armor:' + sl));
    for (const m of Object.keys(MANUFACTURERS)) $('mfr').add(new Option(MANUFACTURERS[m].name, m));

    function roll() {
      const type = $('type').value || undefined;
      const mfr = $('mfr').value;
      const out = [];
      for (let i = 0; out.length < 36 && i < 4000; i++) {
        const w = type?.startsWith('armor:') ? generateArmor({ level: 5, luck: 2, slot: type.slice(6) }) : generateWeapon({ level: 5, luck: 2, type });
        if (mfr && w.manufacturer !== mfr) continue;
        out.push(w);
      }
      $('grid').innerHTML = out.map((w) => {
        const info = w.kind === 'armor' ? { name: w.name, manufacturer: w.manufacturer, components: Object.values(w.look) } : weaponInfo(w);
        return `<div class="w" style="--rc:${RARITY[w.rarity].css}"><img src="${thumbs.get(w)}"><b>${info.name}</b><span>${info.manufacturer}</span><span>${info.components.join(' · ')}</span></div>`;
      }).join('');
    }
    $('roll').onclick = roll;
    $('type').onchange = roll;
    $('mfr').onchange = roll;
    roll();
  </script>
</body>
</html>
